# Test-only IEEE 802.11s SAE/AMPE profile for legal 2.4 GHz HT40− validation.
# Do not reuse this credential for a deployed mesh.
ctrl_interface=/run/wpa_supplicant-rtw88-mesh

network={
	ssid="rtw88-secure-mesh-ht40minus"
	mode=5
	frequency=2472
	ht40=-1
	key_mgmt=SAE
	psk="rtw88-mesh-test-2026"
	ieee80211w=2
	mesh_fwding=1
}

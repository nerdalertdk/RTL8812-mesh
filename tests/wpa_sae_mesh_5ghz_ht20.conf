# Test-only IEEE 802.11s SAE/AMPE profile for non-DFS 5 GHz HT20 validation.
# Do not reuse this credential for a deployed mesh.
ctrl_interface=/run/wpa_supplicant-rtw88-mesh

network={
	ssid="rtw88-secure-mesh-5ghz-ht20"
	mode=5
	frequency=5745
	disable_ht40=1
	disable_vht=1
	key_mgmt=SAE
	psk="rtw88-mesh-test-2026"
	ieee80211w=2
	mesh_fwding=1
}
